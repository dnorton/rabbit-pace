# Opens PRs when new versions of dependencies are released.
version: 2
updates:
  # Go modules (Lip Gloss and its dependencies).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Charm's libraries are released together; update them in one PR.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"

  # Actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The golang base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
